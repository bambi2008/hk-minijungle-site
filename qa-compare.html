<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HK MINIJUNGLE design QA comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #18201c; color: #fff; font-family: Arial, sans-serif; }
      h1 { margin: 0 0 20px; font-size: 20px; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
      figure { margin: 0; background: #0a110e; }
      figcaption { padding: 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
      img { width: 100%; display: block; object-fit: contain; object-position: top; background: #f4f1e8; }
    </style>
  </head>
  <body>
    <h1>Selected visual target and implementation — same comparison surface</h1>
    <main>
      <figure><figcaption>Selected visual target</figcaption><img src="/output/qa/selected-reference.png" alt="Selected visual target" /></figure>
      <figure><figcaption>Implementation — 1440 × 1024 viewport, corrected</figcaption><img src="/output/qa/home-en-desktop-1440.png" alt="Implementation screenshot" /></figure>
    </main>
  </body>
</html>
