    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HK MINIJUNGLE design QA comparison</title>
    <style>
      * { box-sizing: border-box; }

      figcaption { padding: 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
      img { width: 100%; display: block; object-fit: contain; object-position: top; background: #f4f1e8; }
    </style>
  </head>
  <body>
    <h1>Gardify information architecture reference and HK MINIJUNGLE plant library implementation</h1>
    <main>
      <figure><figcaption>Source reference — Gardify plant search, 1280 × 800</figcaption><img src="/output/qa/plant-library/gardify-source-search-desktop.png" alt="Gardify plant-search reference" /></figure>
      <figure><figcaption>Implementation — HK MINIJUNGLE plant library, 1280 × 800</figcaption><img src="/output/qa/plant-library/library-desktop-1280x800.png" alt="HK MINIJUNGLE plant-library implementation" /></figure>
    </main>
  </body>
